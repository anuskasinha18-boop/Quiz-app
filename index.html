<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Trivia Quiz</title>
  <!-- Google Fonts for sleek premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="quiz-theme">

  <!-- Mobile phone wrapper mockup for high premium feel -->
  <div class="phone-frame">
    
    <!-- ----------------------------------------- -->
    <!-- SCREEN 1: START SCREEN                     -->
    <!-- ----------------------------------------- -->
    <div class="screen start-screen active" id="start-screen">
      <div class="brand-header">
        <div class="trophy-glow">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trophy-icon"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/><path d="M12 2a6 6 0 0 0-6 6v5a6 6 0 0 0 12 0V8a6 6 0 0 0-6-6z"/></svg>
        </div>
        <h1>TRIVIA ELITE</h1>
        <p>Challenge your mind, test your limits</p>
      </div>

      <div class="setup-container">
        <!-- Input Username -->
        <div class="setup-group">
          <label for="username">Enter Name</label>
          <input type="text" id="username" placeholder="Guest Player" maxlength="15" autocomplete="off">
        </div>

        <!-- Category selector -->
        <div class="setup-group">
          <label for="category-select">Select Category</label>
          <select id="category-select">
            <option value="9">General Knowledge</option>
            <option value="21" selected>Sports</option>
            <option value="23">History</option>
            <option value="17">Science & Nature</option>
            <option value="22">Geography</option>
            <option value="11">Film & Movies</option>
            <option value="12">Music</option>
          </select>
        </div>

        <!-- Difficulty selection tabs -->
        <div class="setup-group">
          <label>Select Difficulty</label>
          <div class="difficulty-tabs">
            <button class="diff-tab active" data-diff="easy">Easy</button>
            <button class="diff-tab" data-diff="medium">Medium</button>
            <button class="diff-tab" data-diff="hard">Hard</button>
          </div>
        </div>

        <!-- Question amount tabs -->
        <div class="setup-group">
          <label>Number of Questions</label>
          <div class="amount-tabs">
            <button class="amt-tab active" data-amt="10">10</button>
            <button class="amt-tab" data-amt="15">15</button>
            <button class="amt-tab" data-amt="20">20</button>
          </div>
        </div>
      </div>

      <button class="primary-btn btn-glow" id="start-btn">Start Quiz</button>
    </div>

    <!-- ----------------------------------------- -->
    <!-- SCREEN 2: QUIZ SCREEN                      -->
    <!-- ----------------------------------------- -->
    <div class="screen quiz-screen" id="quiz-screen">
      <!-- Wave top header background inside the screen -->
      <div class="quiz-wave-bg"></div>

      <!-- Header stats with indicators matching mockup -->
      <div class="quiz-header">
        <div class="stat-badge badge-dark">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="question-progress-text">1 of 10</span>
        </div>
        
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-bar-fill" style="width: 10%;"></div>
        </div>

        <div class="stat-badge badge-orange">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/><path d="M12 2a6 6 0 0 0-6 6v5a6 6 0 0 0 12 0V8a6 6 0 0 0-6-6z"/></svg>
          <span id="score-text">0 of 10</span>
        </div>
      </div>

      <!-- Question Card Container -->
      <div class="question-card-container">
        
        <!-- Timer Ring (Sits on top-center of card edge) -->
        <div class="timer-ring-container">
          <svg class="timer-svg" width="64" height="64" viewBox="0 0 64 64">
            <circle class="timer-circle-track" cx="32" cy="32" r="28" />
            <circle class="timer-circle-fill" id="timer-circle-fill" cx="32" cy="32" r="28" />
          </svg>
          <div class="timer-text" id="timer-countdown">20</div>
        </div>

        <!-- The Dark Question Card -->
        <div class="question-card">
          <!-- Hint Badge Trigger -->
          <button class="hint-badge" id="hint-btn" title="Elimate two wrong options">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .3 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            <span>Hint</span>
          </button>

          <h2 class="question-number">Question <span id="current-question-num" class="orange-text">01</span></h2>
          <p class="question-category" id="question-category">Sports Quiz</p>
          
          <div class="divider"></div>
          
          <p class="question-text" id="question-text">Loading question...</p>
        </div>
      </div>

      <!-- Option list matching the mockup -->
      <div class="options-container" id="options-container">
        <!-- Dynamic Option elements injected by JS -->
      </div>

      <!-- Orange Next button -->
      <button class="primary-btn btn-glow disabled" id="next-btn" disabled>Next</button>
    </div>

    <!-- ----------------------------------------- -->
    <!-- SCREEN 3: RESULT SCREEN                     -->
    <!-- ----------------------------------------- -->
    <div class="screen result-screen" id="result-screen">
      <div class="result-wave-bg"></div>

      <div class="result-header">
        <div class="result-trophy">
          <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="trophy-icon"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/><path d="M12 2a6 6 0 0 0-6 6v5a6 6 0 0 0 12 0V8a6 6 0 0 0-6-6z"/></svg>
        </div>
        <h2 id="result-greeting">Congratulations!</h2>
        <p id="result-username">Guest Player</p>
      </div>

      <!-- Visual Circle Score display -->
      <div class="score-circle-wrapper">
        <svg class="score-svg" width="120" height="120" viewBox="0 0 120 120">
          <circle class="score-circle-track" cx="60" cy="60" r="50"/>
          <circle class="score-circle-fill" id="score-circle-fill" cx="60" cy="60" r="50"/>
        </svg>
        <div class="score-circle-value">
          <span class="score-value-num" id="score-ratio">0/10</span>
          <span class="score-value-label">SCORE</span>
        </div>
      </div>

      <p class="score-summary-text" id="score-summary-text">You got 0% of the questions correct!</p>

      <!-- Review log accordion header -->
      <div class="review-header">
        <h3>Question Review</h3>
      </div>

      <!-- Question reviews container -->
      <div class="review-container" id="review-container">
        <!-- Review rows injected by JS -->
      </div>

      <button class="primary-btn btn-glow" id="restart-btn">Restart Quiz</button>
    </div>

  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
